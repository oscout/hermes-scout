[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-scout"
version = "1.0.0"
description = "Scout messaging integration for Hermes Agent — send, ask, and broadcast to Scout agents"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["build", "twine"]

[project.urls]
Home = "https://github.com/yourname/hermes-scout"

[tool.hatch.build.targets.wheel]
packages = ["hermes_scout"]

[tool.hatch.build.targets.sdist]
include = ["hermes_scout", "README.md", "LICENSE"]